{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Пагинация">
  {% if page_obj.has_previous %}<a class="page-link" href="?{% if pagination_qs %}{{ pagination_qs }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">{% include "partials/icon.html" with icon="arrow-left" %}</a>{% endif %}
  <span class="page-link page-link--current">{{ page_obj.number }}</span>
  <span class="page-link page-link--disabled">/ {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="page-link" href="?{% if pagination_qs %}{{ pagination_qs }}&amp;{% endif %}page={{ page_obj.next_page_number }}">{% include "partials/icon.html" with icon="arrow-right" %}</a>{% endif %}
</nav>
{% endif %}
